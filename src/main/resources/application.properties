# Server
server.port=${PORT:3000}
server.servlet.context-path=/

# Gemini API
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models

# Publishing Schedule
publishing.min-interval-minutes=${MIN_PUBLISH_INTERVAL_MIN:20}
publishing.max-interval-minutes=${MAX_PUBLISH_INTERVAL_MIN:45}
publishing.initial-delay-seconds=90
publishing.max-catchup-posts=5

# Editorial
editorial.min-score=${MIN_EDITORIAL_SCORE:0.6}
discovery.max-topics=${MAX_TOPICS_PER_CYCLE:15}

# H2 Database (file-based for persistence)
spring.datasource.url=jdbc:h2:file:./data/persona;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging & Performance Metrics
logging.level.com.persona=INFO
